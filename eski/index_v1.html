<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23491F9D'/%3E%3Cpath d='M14 46c8-4 12-14 16-26M30 34c6-6 14-8 20-6' stroke='white' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Maktab maslahatçilari KPI tizimi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* «Kelajak markazlari» brend palitrasi — logotip binafşa rangi #491F9D asosida */
  --navy:#2A1163; --navy2:#491F9D; --brand:#491F9D; --brand-l:#7B57D1; --lilac:#EEE8FA;
  --gold:#F4B740; --gold-soft:#FFF5DF;
  --bg:#F6F4FB; --card:#fff; --ink:#1E1440; --muted:#6B6488; --line:#E5E0F1;
  --a:#1F8A5B; --b:#3D6FD9; --c:#D9931A; --d:#C8423B;
  --a-soft:#E3F4EC; --b-soft:#E7EEFC; --c-soft:#FCF0D9; --d-soft:#F9E4E2;
  --r:14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
header{position:relative;overflow:hidden;background:linear-gradient(120deg,#2A1163 0%,#3A1784 45%,#491F9D 100%);color:#fff;padding:18px 24px 0}
header>*{position:relative;z-index:1}
header .swoosh{position:absolute;right:-40px;top:-10px;width:620px;height:170px;opacity:.16;z-index:0;pointer-events:none}
@media(max-width:700px){header .swoosh{display:none}}
.top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;gap:12px;align-items:center}
.logo{height:60px;width:auto;display:block}
.brand .div{width:1px;align-self:stretch;background:rgba(255,255,255,.25);margin:4px 2px}
.brand h1{margin:0;font-size:18px;font-weight:800;letter-spacing:.2px}
.brand p{margin:2px 0 0;font-size:12px;color:#D6CCF3}
.top-ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top-ctrl label{font-size:12px;color:#D6CCF3}
.top-ctrl select{background:rgba(255,255,255,.1);border:1px solid #6E4BC4;color:#fff;border-radius:8px;padding:7px 10px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600}
.btn:hover{border-color:#C5B9E6}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2A1163}
.btn.gold:hover{background:#F7C55E;border-color:#F7C55E}
.btn.navy:hover{background:var(--brand-l);border-color:var(--brand-l)}
.btn.navy{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ghost-w{background:transparent;border-color:#6E4BC4;color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--d);border-color:#efc7c4}
.btn:disabled{opacity:.5;cursor:not-allowed}
nav.tabs{display:flex;gap:4px;margin-top:16px;overflow-x:auto}
nav.tabs button{background:transparent;border:0;color:#D6CCF3;padding:10px 14px;border-radius:10px 10px 0 0;cursor:pointer;font-weight:700;white-space:nowrap}
nav.tabs button.on{background:var(--bg);color:var(--brand)}
nav.tabs button:not(.on):hover{color:#fff}
main{max-width:1240px;margin:0 auto;padding:20px 24px 60px}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-size:13px}
.crumbs a{color:var(--navy2);cursor:pointer;font-weight:700;text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.crumbs span.sep{color:#A69DC2}
.crumbs .cur{font-weight:800}
.lvl{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;background:var(--lilac);color:var(--brand);border-radius:6px;padding:2px 8px;margin-right:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;border-top:3px solid var(--brand)}
.tile .k{font-size:12px;color:var(--muted);font-weight:600}
.tile .v{font-size:28px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--muted);margin-top:2px}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
@media(max-width:960px){.grid2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:15px;font-weight:800;color:var(--navy)}
.card .sub{margin:0 0 12px;color:var(--muted);font-size:12px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}
th{background:#FAF8FE;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid #EFECF7;vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:#F8F6FD}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:8px;background:#ECE8F5;border-radius:5px;overflow:hidden;min-width:80px}
.bar>i{display:block;height:100%;border-radius:5px}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#ECE8F5;min-width:110px}
.stack>i{display:block;height:100%}
.pill{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.p-a{background:var(--a-soft);color:var(--a)}.p-b{background:var(--b-soft);color:var(--b)}
.p-c{background:var(--c-soft);color:#9a6a0b}.p-d{background:var(--d-soft);color:var(--d)}
.p-n{background:#EFECF7;color:var(--muted)}
.score{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.crit-row{display:grid;grid-template-columns:minmax(150px,1.3fr) 2fr 54px;gap:10px;align-items:center;padding:6px 0}
.crit-row .n{font-size:13px;font-weight:600}
.crit-row .n small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.list li{padding:7px 0;border-bottom:1px solid #EFECF7;display:flex;justify-content:space-between;gap:8px;cursor:pointer}
.list{list-style:none;margin:0;padding:0}
.list li:last-child{border-bottom:0}
.list .who{font-weight:600}.list .where{font-size:12px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff}
.note{background:var(--gold-soft);border:1px solid #F1DDAA;border-radius:10px;padding:10px 12px;font-size:13px;color:#5E4300;margin-bottom:14px}
.warn{background:var(--d-soft);border-color:#efc7c4;color:#7d2621}
/* modal */
.ov{position:fixed;inset:0;background:rgba(30,12,70,.5);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:20}
.ov.on{display:flex}
.modal{background:#fff;border-radius:14px;width:min(820px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal .mh h3{margin:0;font-size:16px}
.modal .mb{padding:16px 20px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center;position:sticky;bottom:0;background:#fff;border-radius:0 0 14px 14px}
.x{border:0;background:transparent;font-size:22px;cursor:pointer;color:var(--muted)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.f{grid-template-columns:1fr}}
.f label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
.f .full{grid-column:1/-1}
.ev{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.ev-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ev-h b{font-size:13px}
.ev-h small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.ev-in{display:flex;gap:10px;align-items:center;margin-top:8px}
.ev-in input[type=range]{flex:1;accent-color:var(--navy)}
.ev-in input[type=number]{width:64px;border:1px solid var(--line);border-radius:7px;padding:5px 6px;text-align:right}
.ev textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 8px;margin-top:6px;font-size:12px;min-height:32px;resize:vertical}
.total-box{font-size:22px;font-weight:800}
.crit-tbl td{vertical-align:top}
.crit-tbl td:first-child{font-weight:800;color:var(--navy2);white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;display:none;z-index:40}
.status{font-size:12px;color:#D6CCF3;margin-left:6px}
.reco{border-left:3px solid var(--gold);padding:6px 10px;margin:6px 0;background:#FFFAEE;border-radius:0 8px 8px 0;font-size:13px}
.hist{display:flex;gap:6px;align-items:flex-end;height:120px;padding-top:10px}
.hist .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:28px}
.hist .col i{display:block;width:100%;max-width:34px;border-radius:5px 5px 0 0}
.hist .col span{font-size:10px;color:var(--muted)}
.hist .col b{font-size:11px}
textarea.csv{width:100%;min-height:220px;font-family:ui-monospace,monospace;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:10px}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.flow div{border:1px solid var(--line);border-radius:10px;padding:12px;background:#FBFAFF}
.flow b{display:block;color:var(--navy2);margin-bottom:4px}
.foot{max-width:1240px;margin:0 auto;padding:0 24px 32px;display:flex;align-items:center;gap:14px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:18px}
.foot img{height:34px}
@media print{header .swoosh,nav.tabs,.top-ctrl{display:none}}
.top-ctrl select option,.top-ctrl select optgroup{color:var(--ink);background:#fff}
.top-ctrl select option:disabled{color:#B5AECB}
#year{min-width:84px}
.mgrid{display:grid;gap:8px;align-items:end}
.mcol{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 6px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.mcol:hover{background:var(--lilac)}
.mcol.cur{border-color:var(--brand-l)}
.mcol.fut{opacity:.4;cursor:default}
.mcol.fut:hover{background:transparent}
.mcol b{font-size:13px;font-variant-numeric:tabular-nums}
.mcol .mbar{width:100%;max-width:38px;height:110px;background:#ECE8F5;border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
.mcol .mbar i{display:block;width:100%;border-radius:6px 6px 0 0}
.mcol span{font-size:12px;font-weight:700;color:var(--ink)}
.mcol small{font-size:10px;color:var(--muted)}
.who{display:inline-flex;align-items:center;gap:8px;padding:3px 10px 3px 3px;border-radius:30px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18)}
.who i{width:28px;height:28px;border-radius:50%;background:var(--gold);color:#2A1163;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px}
.who b{display:block;font-size:12px;line-height:1.15;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{display:block;font-size:10.5px;color:#D6CCF3;line-height:1.15}
.btn.out{background:#fff;border-color:#fff;color:var(--brand)}
.btn.out:hover{background:var(--lilac)}
.lock{width:42px;height:42px;border-radius:12px;background:var(--lilac);display:grid;place-items:center;font-size:20px;flex:none}
/* ===== Kiriş oynasi ===== */
body.auth header, body.auth .foot{display:none}
body.auth main{max-width:none;padding:0}
body.auth{background:radial-gradient(1200px 600px at 85% -10%,#E9E1FB 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#FFF1D6 0%,transparent 55%),var(--bg)}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px}
.auth-load{display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:600}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--lilac);border-top-color:var(--brand);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.auth-card{width:min(1040px,100%);display:grid;grid-template-columns:1fr 1.15fr;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 30px 80px -20px rgba(42,17,99,.35),0 0 0 1px rgba(73,31,157,.06)}
.auth-side{position:relative;overflow:hidden;background:linear-gradient(155deg,#2A1163 0%,#3A1784 50%,#5B2DB8 100%);color:#fff;padding:40px 38px;display:flex;flex-direction:column;gap:28px;min-height:600px}
.auth-swoosh{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.auth-side>*{position:relative}
.auth-side>.auth-swoosh{position:absolute;inset:0}
.auth-logo{width:190px;height:auto}
.auth-copy{margin-top:auto}
.auth-copy h1{margin:0 0 12px;font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-.3px}
.auth-copy p{margin:0 0 26px;color:#D9CFF5;font-size:14.5px;max-width:330px}
.feat{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.feat li{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;backdrop-filter:blur(2px)}
.feat b{min-width:38px;height:38px;border-radius:10px;background:var(--gold);color:#2A1163;display:grid;place-items:center;font-size:16px;font-weight:800}
.feat span{font-size:13.5px;color:#EEE8FA}
.auth-org{color:#BFB0EA;font-size:12px}
.auth-main{padding:44px 48px 36px;display:flex;flex-direction:column}
.eyebrow{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--brand);background:var(--lilac);padding:4px 10px;border-radius:20px}
.auth-head h2{margin:14px 0 6px;font-size:28px;font-weight:800;color:var(--navy);letter-spacing:-.3px}
.auth-head p{margin:0 0 22px;color:var(--muted);font-size:14px}
.acct{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:#FBFAFF;border-radius:14px;padding:10px 14px;margin-bottom:22px}
.acct i{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-l));color:#fff;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:14px}
.acct b{display:block;font-size:14px}.acct small{color:var(--muted);font-size:12px}
.acct .ok{margin-left:auto;width:24px;height:24px;border-radius:50%;background:#E3F4EC;color:var(--a);display:grid;place-items:center;font-weight:800;font-size:13px}
.fl{font-size:12px;font-weight:700;color:var(--muted);margin:0 0 8px;letter-spacing:.2px}
.lv-grid{display:grid;gap:10px;margin-bottom:20px}
.lv{position:relative;cursor:pointer;border:1.5px solid var(--line);border-radius:14px;padding:14px 12px 12px;display:flex;flex-direction:column;gap:4px;transition:border-color .15s,box-shadow .15s,background .15s}
.lv:hover{border-color:#C9BCEB}
.lv input{position:absolute;opacity:0;pointer-events:none}
.lv .ic{width:36px;height:36px;border-radius:10px;background:var(--lilac);color:var(--brand);display:grid;place-items:center;margin-bottom:6px;transition:background .15s,color .15s}
.lv .ic svg{width:20px;height:20px}
.lv b{font-size:13.5px;color:var(--ink)}
.lv small{font-size:11.5px;color:var(--muted);line-height:1.35}
.lv.on{border-color:var(--brand);background:#FAF7FF;box-shadow:0 0 0 4px rgba(73,31,157,.10)}
.lv.on .ic{background:var(--brand);color:#fff}
.lv.on::after{content:"✓";position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;background:var(--brand);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.lv:has(input:focus-visible){outline:2px solid var(--brand-l);outline-offset:2px}
.auth-fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.auth-fields select,.auth-fields input{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;font-size:14px;transition:border-color .15s,box-shadow .15s}
.auth-fields select:focus,.auth-fields input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(73,31,157,.10)}
.auth-btn{margin-top:24px;width:100%;height:50px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--brand) 0%,#6A3FD0 100%);color:#fff;font-weight:800;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 24px -8px rgba(73,31,157,.55);transition:transform .1s,box-shadow .15s}
.auth-btn:hover{box-shadow:0 14px 28px -8px rgba(73,31,157,.65)}
.auth-btn:active{transform:translateY(1px)}
.auth-btn span{transition:transform .15s}.auth-btn:hover span{transform:translateX(3px)}
.auth-link{margin-top:10px;width:100%;background:none;border:0;color:var(--muted);font-weight:600;cursor:pointer;padding:8px}
.auth-link:hover{color:var(--brand)}
.auth-note{margin:auto 0 0;padding-top:22px;font-size:12px;color:#9A93B5;text-align:center}
@media(max-width:860px){.auth-card{grid-template-columns:1fr}.auth-side{min-height:0;padding:28px}.auth-copy{margin-top:0}.feat{display:none}.auth-copy p{margin:0}.auth-main{padding:28px 24px}}
@media(max-width:560px){.lv-grid{grid-template-columns:1fr!important}.auth-fields{grid-template-columns:1fr}.auth-head h2{font-size:23px}.auth-wrap{padding:0}.auth-card{border-radius:0}}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:#2A1163;font-size:11px;font-weight:800;margin-left:4px}
.lv.assigned{cursor:default;margin-bottom:6px}
.lv.assigned::after{content:"✓"}
.lv.pend{border-color:#E8C76A;background:#FFFBEF;box-shadow:none}
.lv.pend .ic{background:var(--gold);color:#2A1163}
.lv.pend::after{content:"…";background:var(--gold);color:#2A1163}
.pend-row{display:flex;align-items:center;gap:8px;font-size:13px;color:#8A5B00;font-weight:700;margin:12px 0 0}
.pend-row .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(244,183,64,.6);animation:pl 1.6s infinite}
@keyframes pl{70%{box-shadow:0 0 0 9px rgba(244,183,64,0)}100%{box-shadow:0 0 0 0 rgba(244,183,64,0)}}
.auth-btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand);box-shadow:none}
.auth-btn:disabled{opacity:.5;cursor:not-allowed}
.auth-hint{margin:12px 0 0;font-size:12.5px;color:var(--muted);text-align:center}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--lilac)}
.tl li{position:relative;padding:0 0 12px 12px;font-size:13px}
.tl li::before{content:"";position:absolute;left:-21px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--brand);border:2px solid #fff;box-shadow:0 0 0 1px var(--lilac)}
.tl li.del::before{background:var(--d)}
.tl small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.who2{font-weight:600}
</style>
</head>

<script>
/* ===== DEMO REJIM (GitHub Pages) =====
   claude.ai tashqarisida ochilganda ma'lumotlar bazasi o'rniga brauzer xotirasi ishlatiladi
   va namuna ma'lumotlar avtomatik yaratiladi. */
(function(){
  if(window.claude&&window.claude.use) return;
  window.KPI_DEMO=true;
  const KEY="kpi_demo_db_v1"; let store={};
  try{store=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(_){store={}}
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(_){}};
  const subs=[];
  const parent=p=>p.split("/").slice(0,-1).join("/");
  const notify=col=>{subs.filter(s=>s.col===col).forEach(s=>setTimeout(()=>s.cb(snap(col)),0))};
  const snap=col=>{const pre=col+"/";const docs=Object.keys(store).filter(k=>k.startsWith(pre)&&!k.slice(pre.length).includes("/"))

function quarterOf(k){const [y,m]=k.split("-").map(Number);return y+"-Q"+Math.ceil(m/3)}

function applyScope(){
  const r=S.role; if(!r) return;
  if(r.level==="vil"||r.level==="tum") S.region=r.region;
  if(r.level==="tum") S.district=r.district;
}
function districtsOf(region){const base=DISTRICTS[region]||[];const extra=S.counselors.filter(c=>c.region===region).map(c=>c.district);return [...new Set(base.concat(extra))]}
function deadlineInfo(){
  const now=new Date(), cur=monthKey(now);
  if(S.period!==cur) return null;
  const dl=new Date(now.getFullYear(),now.getMonth(),25,23,59);
  const days=Math.ceil((dl-now)/86400000);
  return days>=0?`Baholaş muddati: ${now.getMonth()+1}-oyning 25-sanasigaça (${days} kun qoldi)`:`Baholaş muddati (25-sana) ötgan`;
}

/* ============ YORDAMÇI ============ */
const $=s=>document.querySelector(s);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(t){const el=$("#toast");el.textContent=t;el.style.display="block";clearTimeout(toast._t);toast._t=setTimeout(()=>el.style.display="none",2600)}
function fmt(n,d=1){return n==null||isNaN(n)?"—":Number(n).toFixed(d).replace(/\.0$/,"")}
function pill(score){const b=band(score);if(!b) return '<span class="pill p-n">Baholanmagan</span>';return `<span class="pill ${b.cls}">${b.label}</span>`}
function barHtml(v,max,color){const p=Math.max(0,Math.min(100,(v||0)/max*100));return `<div class="bar"><i style="width:${p}%;background:${color||barColor(p)}"></i></div>`}
function barColor(p){return p>=86?"var(--a)":p>=71?"var(--b)":p>=56?"var(--c)":"var(--d)"}
function clampNum(v,min,max){v=Number(v);if(isNaN(v))v=0;return Math.max(min,Math.min(max,v))}

/* score of counselor in period (quarter -> average of months) */
function scoreDocs(cid,p){const ms=monthsInPeriod(p);return S.scores.filter(s=>s.scheme===SCHEME&&s.counselorId===cid&&ms.includes(s.month))}
function counselorScore(cid,p){
  const docs=scoreDocs(cid,p); if(!docs.length) return null;
  const total=docs.reduce((s,d)=>s+(+d.total||0),0)/docs.length;
  const crit={}; CRITERIA.forEach(c=>{crit[c.id]=docs.reduce((s,d)=>s+(+(d.criteria||{})[c.id]||0),0)/docs.length});
  return {total,crit,count:docs.length,docs};
}
function scopeCounselors(){
  return S.counselors.filter(c=>(!S.region||c.region===S.region)&&(!S.district||c.district===S.district));
}
function aggregate(list,p){
  const scored=list.map(c=>({c,s:counselorScore(c.id,p)}));
  const ev=scored.filter(x=>x.s);
  const avg=ev.length?ev.reduce((a,x)=>a+x.s.total,0)/ev.length:null;
  const dist={a:0,b:0,c:0,d:0}; ev.forEach(x=>dist[band(x.s.total).key]++);
  const crit={}; CRITERIA.forEach(k=>{crit[k.id]=ev.length?ev.reduce((a,x)=>a+x.s.crit[k.id],0)/ev.length:null});
  return {n:list.length,ev:ev.length,avg,dist,crit,scored};
}

/* ============ RENDER ============ */
function setTab(t){S.tab=t;render()}
function renderTabs(){
  const tabs=[];
  if(S.role&&S.role.level==="tum") tabs.push(["eval","Baholaş"]);
  tabs.push(["monitor",S.role?.level==="tum"?"Tuman monitoringi":"Monitoring"],["list","Maslahatçilar"],["criteria","Mezonlar va tartib"],["report","Hisobot"]);
  if(isAdmin()) tabs.push(["users","Foydalanuvçilar"+(S.reqs.length?` <span class="badge">${S.reqs.length}</span>`:"")]);
  const nav=$("#tabs");
  nav.innerHTML=S.role?tabs.map(([k,l])=>`<button data-tab="${k}" class="${S.tab===k?"on":""}">${l}</button>`).join(""):"";
  nav.querySelectorAll("button").forEach(b=>b.onclick=()=>{if(b.dataset.tab!=="monitor")S.counselor=null;setTab(b.dataset.tab)});
  const who=$("#who"), lo=$("#logout");
  if(S.role&&!S.out){
    const nm=S.meName||"Foydalanuvçi"; const ini=nm.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"?";
    who.innerHTML=`<i>${esc(ini)}</i><span><b>${esc(nm)}</b><small>${esc(S.role.level==="tum"?S.role.district:S.role.level==="vil"?S.role.region:"Respublika")}${isAdmin()?" · admin":""}</small></span>`;
    who.style.display=""; lo.style.display="";
    $("#swLv").style.display=isAdmin()?"":"none";
  } else {who.style.display="none"; lo.style.display="none"; $("#swLv").style.display="none";}
}
function render(){
  const app=$("#app");
  renderTabs();
  if(!S.roleReady){document.body.classList.add("auth");app.innerHTML='<div class="auth-wrap"><div class="auth-load"><span class="spin"></span>Yuklanmoqda…</div></div>';return}
  const authView=!S.role||S.out||S.switching;
  document.body.classList.toggle("auth",authView);
  if(authView){app.innerHTML=viewRole();bindRole();return}
  if(!S.loaded&&S.tab!=="criteria"){app.innerHTML='<div class="card empty"><b>Ma\'lumotlar yuklanmoqda…</b>Bir neça soniya kuting.</div>';return}
  applyScope();
  if(S.tab==="eval") app.innerHTML=viewCabinet();
  else if(S.tab==="monitor") app.innerHTML=S.counselor?viewCounselor():viewMonitor();
  else if(S.tab==="list") app.innerHTML=viewList();
  else if(S.tab==="criteria") app.innerHTML=viewCriteria();
  else if(S.tab==="report") app.innerHTML=viewReport();
  else if(S.tab==="users"&&isAdmin()) app.innerHTML=viewUsers();
  bindView();
}
function crumbs(){
  const lv=S.role?.level;
  const lk=(go,txt,locked)=>locked?`<span class="muted">${esc(txt)}</span>`:`<a data-go="${go}">${esc(txt)}</a>`;
  let h=`<div class="crumbs">${lk("rep","Respublika",lv!=="resp")}`;
  if(S.region) h+=`<span class="sep">›</span>${lk("reg",S.region,lv==="tum")}`;
  if(S.district) h+=`<span class="sep">›</span>${lk("dis",S.district,false)}`;
  if(S.counselor){const c=S.counselors.find(x=>x.id===S.counselor);h+=`<span class="sep">›</span><span class="cur">${esc(c?c.name:"")}</span>`}
  return h+`</div>`;
}
function levelName(){return S.district?"Tuman (şahar)":S.region?"Viloyat":"Respublika"}

function viewMonitor(){
  const list=scopeCounselors(); const ag=aggregate(list,S.period);
  const cover=ag.n?Math.round(ag.ev/ag.n*100):0;
  let h=crumbs();
  h+=`<div class="card-h" style="margin-bottom:12px"><div><span class="lvl">${levelName()} darajasi</span><b style="font-size:18px">${esc(S.district||S.region||"Özbekiston Respublikasi")}</b><div class="muted small">${periodLabel(S.period)} · ${isAgg(S.period)?aggNote(S.period):"oylik baholaş"}</div></div>
   <div style="display:flex;gap:8px;flex-wrap:wrap">${canScore()?`<button class="btn" data-act="addC">+ Maslahatçi qöşiş</button>`:""}${S.isOwner?`<button class="btn sm" data-act="demo">Namuna ma'lumot</button>`:""}</div></div>`;
  if(!S.counselors.length){
    return h+`<div class="card empty"><b>Hali maslahatçilar kiritilmagan</b>Tuman muvofiqlaştiruvçilari öz tumanidagi maslahatçilarni qöşib, har oy baholaydi. Natijalar avtomatik ravişda viloyat va respublika darajasida umumlaştiriladi.<div style="margin-top:12px">${canScore()?`<button class="btn navy" data-act="addC">+ Birinçi maslahatçini qöşiş</button>`:""} ${S.isOwner?`<button class="btn" data-act="demo">Namuna ma'lumot bilan sinab köriş</button>`:""}</div></div>`;
  }
  h+=`<div class="tiles">
   <div class="tile"><div class="k">Maslahatçilar</div><div class="v">${ag.n}</div><div class="s">${S.district?"tumandagi":S.region?"viloyatdagi":"respublika böyiça"}</div></div>
   <div class="tile"><div class="k">Baholanganlar</div><div class="v">${ag.ev}</div><div class="s">qamrov ${cover}%</div></div>
   <div class="tile"><div class="k">Örtaça KPI</div><div class="v">${fmt(ag.avg)}</div><div class="s">100 ball tizimida</div></div>
   <div class="tile"><div class="k">A'lo natija</div><div class="v" style="color:var(--a)">${ag.dist.a}</div><div class="s">rağbatlantirişga tavsiya</div></div>
   <div class="tile"><div class="k">Metodik yordam kerak</div><div class="v" style="color:var(--d)">${ag.dist.d}</div><div class="s">qoniqarsiz (55 va past)</div></div>
  </div>`;
  if(isAgg(S.period)) h+=monthlyCard(list);
  h+=`<div class="grid2"><div>`+unitTable(list)+`</div><div>`+critCard(ag)+rankCard(ag)+`</div></div>`;
  return h;
}
function unitTable(list){
  if(S.district){
    const rows=list.map(c=>({c,s:counselorScore(c.id,S.period)})).sort((a,b)=>(b.s?.total??-1)-(a.s?.total??-1));
    return `<div class="card"><h2>Tuman maslahatçilari</h2><p class="sub">Har bir maslahatçini tuman muvofiqlaştiruvçisi oyiga bir marta baholaydi</p>
    <div style="overflow-x:auto"><table><thead><tr><th>F.I.Ş.</th><th>Maktab</th><th class="num">KPI</th><th>Daraja</th><th></th></tr></thead><tbody>
    ${rows.map(({c,s})=>`<tr class="click" data-open="${esc(c.id)}"><td><b>${esc(c.name)}</b>${c.demo?' <span class="pill p-n">namuna</span>':''}</td><td>${esc(c.school)}</td><td class="num score">${s?fmt(s.total):"—"}</td><td>${pill(s?.total)}</td><td class="num">${canEditC(c)&&!isAgg(S.period)?`<button class="btn sm gold" data-eval="${esc(c.id)}">${s?"Tahrirlaş":"Baholaş"}</button>`:""}</td></tr>`).join("")}
    </tbody></table></div>${isAgg(S.period)?'<p class="muted small">Baholaş oylik davrda kiritiladi — yuqoridan oyni tanlang.</p>':''}</div>`;
  }
  const key=S.region?"district":"region";
  const units=S.region?districtsOf(S.region):REGIONS.slice();
  const rows=units.map(u=>{const l=list.filter(c=>c[key]===u);return {u,ag:aggregate(l,S.period)}}).sort((a,b)=>(b.ag.avg??-1)-(a.ag.avg??-1));
  return `<div class="card"><h2>${S.region?"Tumanlar (şaharlar) kesimida":"Hududlar kesimida"}</h2><p class="sub">Qatorni bosing — quyi darajaga ötadi</p>
  <div style="overflow-x:auto"><table><thead><tr><th>#</th><th>${S.region?"Tuman (şahar)":"Hudud"}</th><th class="num">Maslahatçi</th><th class="num">Baholangan</th><th>Örtaça KPI</th><th>Taqsimot</th></tr></thead><tbody>
  ${rows.map((r,i)=>{const d=r.ag.dist,t=r.ag.ev||1;return `<tr class="click" data-unit="${esc(r.u)}"><td class="muted">${r.ag.ev?i+1:""}</td><td><b>${esc(r.u)}</b></td><td class="num">${r.ag.n}</td><td class="num">${r.ag.ev}${r.ag.n?` <span class="muted small">(${Math.round(r.ag.ev/r.ag.n*100)}%)</span>`:""}</td>
   <td><div style="display:flex;gap:8px;align-items:center"><span class="score" style="width:38px">${fmt(r.ag.avg)}</span>${barHtml(r.ag.avg,100)}</div></td>
   <td>${!r.ag.n?'<span class="pill p-n">Ma\'lumot kiritilmagan</span>':r.ag.ev?`<div class="stack" title="A'lo ${d.a} · Yaxşi ${d.b} · Qoniqarli ${d.c} · Qoniqarsiz ${d.d}">${["a","b","c","d"].map(k=>`<i style="width:${d[k]/t*100}%;background:var(--${k})"></i>`).join("")}</div>`:'<span class="muted small">ma\'lumot yöq</span>'}</td></tr>`}).join("")}
  </tbody></table></div>
  <div class="legend">${BANDS.map(b=>`<span><i style="background:${b.color}"></i>${b.label} (${b.min}${b.key==="a"?"–100":b.key==="d"?"–55":"–"+(BANDS[BANDS.indexOf(b)-1].min-1)})</span>`).join("")}</div></div>`;
}
function critCard(ag){
  if(!ag.ev) return `<div class="card"><h2>Mezonlar böyiça bajariliş</h2><p class="sub">Tanlangan davrda baho kiritilmagan</p></div>`;
  const rows=CRITERIA.map(c=>({c,v:ag.crit[c.id],p:ag.crit[c.id]/c.max*100}));
  const weak=rows.slice().sort((a,b)=>a.p-b.p).slice(0,2);
  return `<div class="card"><h2>Mezonlar böyiça bajariliş</h2><p class="sub">Maksimal ballga nisbatan foiz — metodik yordam yönalişini körsatadi</p>
  ${rows.map(r=>`<div class="crit-row"><div class="n">${esc(r.c.short)}<small>${fmt(r.v)} / ${r.c.max}</small></div>${barHtml(r.v,r.c.max)}<div class="num small"><b>${Math.round(r.p)}%</b></div></div>`).join("")}
  <div class="reco"><b>Eng zaif yönalişlar:</b> ${weak.map(w=>esc(w.c.short)+" ("+Math.round(w.p)+"%)").join(", ")}. Seminar-trening va metodik tavsiyalarni şu mavzularga qarating.</div></div>`;
}
function rankCard(ag){
  const ev=ag.scored.filter(x=>x.s).sort((a,b)=>b.s.total-a.s.total);
  if(!ev.length) return "";
  const li=x=>`<li data-open="${esc(x.c.id)}"><div><div class="who">${esc(x.c.name)}</div><div class="where">${esc(x.c.school)} · ${esc(x.c.district)}</div></div><div style="text-align:right"><span class="score">${fmt(x.s.total)}</span><br>${pill(x.s.total)}</div></li>`;
  const low=ev.filter(x=>x.s.total<71).slice(-5).reverse();
  return `<div class="card"><h2>Eng yaxşi natijalar</h2><p class="sub">Rağbatlantiriş va tajriba almaşiş uçun</p><ul class="list">${ev.slice(0,5).map(li).join("")}</ul></div>
  <div class="card"><h2>Metodik yordam röyxati</h2><p class="sub">70 balldan past — individual reja tuziladi</p>${low.length?`<ul class="list">${low.map(li).join("")}</ul>`:'<div class="muted small">Bunday maslahatçilar yöq.</div>'}</div>`;
}

  let h=crumbs();

     ${CRITERIA.map(k=>`<div class="crit-row"><div class="n">${esc(k.short)}<small>${fmt(s.crit[k.id])} / ${k.max}</small></div>${barHtml(s.crit[k.id],k.max)}<div class="num small"><b>${Math.round(s.crit[k.id]/k.max*100)}%</b></div></div>`).join("")}

    const notes=s.docs.filter(d=>d.comment||Object.values(d.notes||{}).some(Boolean));
    if(notes.length) h+=`<div class="card"><h2>Baholovçi izohlari</h2>${notes.map(d=>`<div style="margin-bottom:8px"><b class="small">${monthLabel(d.month)}</b>${d.penalty?` <span class="pill p-d">jarima −${fmt(d.penalty)}</span>`:""}<div>${esc(d.comment||"")}</div>${CRITERIA.filter(k=>(d.notes||{})[k.id]).map(k=>`<div class="small muted">• ${esc(k.short)}: ${esc(d.notes[k.id])}</div>`).join("")}</div>`).join("")}</div>`;
  } else h+=`<div class="card empty"><b>${periodLabel(S.period)} uçun baho kiritilmagan</b>${isAgg(S.period)?"Davr bahosi oylik baholarning örtaçasidan hisoblanadi.":"Tuman muvofiqlaştiruvçisi «Baholaş» tugmasi orqali ball qöyadi."}</div>`;
  h+=`</div><div><div class="card"><h2>Dinamika</h2><p class="sub">${yearOf(S.period)}-yil, oyma-oy</p><div class="hist">${hist.map(x=>`<div class="col"><b>${x.s?fmt(x.s.total,0):""}</b><i style="height:${x.s?Math.max(4,x.s.total*0.8):2}px;background:${x.s?band(x.s.total).color:"#E5E0F1"}"></i><span>${shortMonth(x.m)}</span></div>`).join("")}</div></div>
  <div class="card"><h2>Maqsad (rağbat)</h2><p class="sub">Keyingi darajaga çiqiş uçun</p>${s?nextGoal(s.total):'<div class="muted small">Avval baholaş kerak.</div>'}</div>
  <div class="card"><h2>Özgarişlar tarixi</h2><p class="sub">Kim, qaçon, nimani özgartirgani — har bir saqlaş va öçiriş yozib boriladi</p><div id="histBox" data-owner="${esc(c.owner)}" data-cid="${esc(c.docId)}"><div class="muted small">Yuklanmoqda…</div></div></div></div></div>`;
  return h;
}
function nextGoal(t){
  const b=band(t); const i=BANDS.indexOf(b);
  if(i===0) return `<div class="reco">A'lo daraja. Natijani saqlab qoliş va tumandagi hamkasblarga tajriba ulaşiş (mentorlik) tavsiya etiladi.</div>`;
  const nb=BANDS[i-1]; return `<div class="reco"><b>${nb.label}</b> darajasiga çiqiş uçun yana <b>${fmt(nb.min-t)}</b> ball kerak. Eng kam bajarilgan mezonlardan boşlang.</div>`;
}

function bindRole(){
  const di=$("#doIn"); if(di) di.onclick=()=>{S.out=false;try{localStorage.removeItem("kpi_out")}catch(_){};S.tab=S.role.level==="tum"?"eval":"monitor";S.region=S.role.region;S.district=S.role.district;render();toast("Tizimga kirdingiz")};
  const re=$("#rEdit"); if(re) re.onclick=()=>{S.editReq=true;render()};
  const rb=$("#rBack"); if(rb) rb.onclick=()=>{S.editReq=false;render()};
  const rc=$("#rCancelReq"); if(rc) rc.onclick=async()=>{rc.disabled=true;try{await db.doc("req/"+S.uid).delete();S.myReq=null;S.editReq=false;render();toast("Sörov bekor qilindi")}catch(err){handleWriteErr(err);rc.disabled=false}};
  const sb=$("#swBack"); if(sb) sb.onclick=()=>{S.switching=false;render()};
  const f=$("#rf"); if(!f) return;
  const adminForm=!!f.querySelector('input[name=level][value=resp]');
  const cur=adminForm?(S.role&&S.role.district)||"":yA((S.myReq&&S.myReq.district)||"");
  const fillD=()=>{const reg=f.region.value;
    f.district.innerHTML=`<option value="">Tanlang</option>`+districtsOf(reg).map(d=>`<option ${d===cur?"selected":""}>${esc(d)}</option>`).join("")+`<option value="__other">Boşqa (röyxatda yöq)…</option>`;
    f.districtOther.style.display="none";};
  const sync=()=>{const lv=f.level.value;$("#rReg").style.display=lv==="resp"?"none":"";$("#rDis").style.display=lv==="tum"?"":"none";$("#rReg").style.gridColumn=lv==="vil"?"1/-1":"";f.querySelectorAll(".lv").forEach(l=>l.classList.toggle("on",l.querySelector("input").checked))};
  f.querySelectorAll("[name=level]").forEach(x=>x.onchange=sync);
  f.region.onchange=fillD; f.district.onchange=()=>{f.districtOther.style.display=f.district.value==="__other"?"":"none"};
  fillD(); sync();
  if(adminForm){f.onsubmit=e=>{e.preventDefault();
    const level=f.level.value;let region=null,district=null;
    if(level!=="resp"){region=f.region.value;if(!region) return toast("Viloyatni tanlang")}
    if(level==="tum"){district=f.district.value==="__other"?yA(f.districtOther.value.trim().replace(/\s+/g," ")):f.district.value;if(!district) return toast("Tumanni tanlang")}
    S.view={level,region,district};try{localStorage.setItem("kpi_view",JSON.stringify(S.view));localStorage.removeItem("kpi_out")}catch(_){}
    S.out=false;S.switching=false;deriveRole();S.counselor=null;S.region=S.role.region;S.district=S.role.district;S.tab=level==="tum"?"eval":"monitor";
    render();window.scrollTo(0,0);toast(LEVELS[level]+" darajasida kirdingiz")};return}
  f.onsubmit=async e=>{e.preventDefault();
    const level=f.level.value; let region=f.region.value||null,district=null;
    if(!region) return toast("Viloyatni tanlang");
    if(level==="tum"){district=f.district.value==="__other"?yA(f.districtOther.value.trim().replace(/\s+/g," ")):f.district.value;if(!district) return toast("Tumanni tanlang")}
    const btn=f.querySelector(".auth-btn"); btn.disabled=true;
    const q={level,region,district,at:new Date().toISOString()};
    try{await db.doc("req/"+S.uid).set(q);S.myReq=q;S.editReq=false;render();toast("Sörov yuborildi")}catch(err){handleWriteErr(err);btn.disabled=false}
  };
}

async function loadHist(){
  const box=$("#histBox"); if(!box||!db) return;
  const owner=box.dataset.owner,cid=box.dataset.cid;
  try{let docs;
    try{const sn=await db.collection("w/"+owner+"/h").where("counselorId","==",cid).get();docs=sn.docs.map(d=>d.data())}
    catch(_){const sn=await db.collection("w/"+owner+"/h").get();docs=sn.docs.map(d=>d.data()).filter(x=>x.counselorId===cid)}
    if(!$("#histBox")) return;
    docs.sort((a,b)=>String(b.at).localeCompare(String(a.at)));
    const L={"c-add":"Maslahatçi qöşildi","c-edit":"Ma'lumot tahrirlandi","c-del":"Maslahatçi öçirildi","s-save":"Baho saqlandi","s-del":"Baho öçirildi","migrate":"Eski bazadan köçirildi"};
    box.innerHTML=docs.length?`<ul class="tl">${docs.slice(0,40).map(x=>`<li class="${x.action==="s-del"||x.action==="c-del"?"del":""}"><div><b>${L[x.action]||esc(x.action)}</b>${x.month?` · ${monthLabel(x.month)}`:""}${x.total!=null?` · <b>${fmt(x.total)}</b> ball`:""}${x.prev!=null&&x.action==="s-save"?` <span class="muted">(avval ${fmt(x.prev)})</span>`:""}</div><small>${x.at?new Date(x.at).toLocaleString("uz-UZ"):""} · ${esc(nameOf(owner))}</small></li>`).join("")}</ul>`
      :'<div class="muted small">Hali özgarişlar yozilmagan.</div>';

}

  openModal(`<div class="mh"><div><h3>Baholaş: ${esc(c.name)}</h3><div class="small muted">${esc(c.school)} · ${esc(c.district)} · ${monthLabel(month)}</div></div><button class="x" data-close>×</button></div>
  <form id="ef"><div class="mb">
  ${CRITERIA.map(k=>`<div class="ev" style="border-left:4px solid ${k.color}"><div class="ev-h"><div><b><span style="color:${k.color}">${k.no}</span> ${esc(k.name)}</b><small>${esc(k.ind)}</small></div><span class="pill p-n" id="sum_${k.id}">0 / ${k.max}</span></div>
   ${k.subs.map(sb=>{const sid=k.id+"_"+sb.id;const val=+(ex?.subs||{})[sid]||0;return `<div style="margin-top:8px"><div class="small"><b>${esc(sb.name)}</b> <span class="muted">— ${esc(sb.hint)}</span></div>
   <div class="ev-in" style="margin-top:4px"><input type="range" min="0" max="${sb.max}" step="0.5" value="${val}" data-r="${sid}"><input type="number" min="0" max="${sb.max}" step="0.5" value="${val}" data-n="${sid}"><span class="small muted" style="width:34px">/ ${sb.max}</span></div></div>`}).join("")}
   <textarea placeholder="Dalil / izoh: bayonnoma, röyxat, tadbir nomi, foiz körsatkiçi…" data-t="${k.id}" maxlength="500">${esc(nt[k.id]||"")}</textarea></div>`).join("")}
  <div class="ev" style="border-color:#efc7c4"><div class="ev-h"><div><b>Jarima (intizom)</b><small>Topşiriq muddati buzilişi, notöğri ma'lumot va h.k. — faqat izoh bilan</small></div><span class="pill p-d">0 … −${PENALTY_MAX}</span></div>
   <div class="ev-in"><input type="range" min="0" max="${PENALTY_MAX}" step="0.5" value="${+ex?.penalty||0}" data-r="pen"><input type="number" min="0" max="${PENALTY_MAX}" step="0.5" value="${+ex?.penalty||0}" data-n="pen"></div></div>
  <div class="f"><div class="full"><label>Umumiy xulosa va tavsiya</label><textarea name="comment" maxlength="1000" rows="3">${esc(ex?.comment||"")}</textarea></div></div>
  </div>
  <div class="mf"><div><div class="small muted">Jami KPI</div><div class="total-box" id="tot">0</div><div id="totb"></div></div><div style="display:flex;gap:8px">${ex?`<button type="button" class="btn danger" id="delE">Bahoni öçiriş</button>`:""}<button type="button" class="btn" data-close>Bekor qiliş</button><button class="btn navy" id="saveE">Saqlaş</button></div></div></form>`);
  const f=$("#ef");
  const read=()=>{const cr={},subs={};CRITERIA.forEach(k=>{let t=0;k.subs.forEach(sb=>{const sid=k.id+"_"+sb.id;const v=clampNum(f.querySelector(`[data-n=${sid}]`).value,0,sb.max);subs[sid]=v;t+=v});cr[k.id]=t});const pen=clampNum(f.querySelector("[data-n=pen]").value,0,PENALTY_MAX);const sum=Object.values(cr).reduce((a,b)=>a+b,0);return {cr,subs,pen,total:Math.max(0,Math.round((sum-pen)*10)/10)}};
  const upd=()=>{const r=read();CRITERIA.forEach(k=>{$("#sum_"+k.id).textContent=fmt(r.cr[k.id])+" / "+k.max});$("#tot").textContent=fmt(r.total)+" / 100";$("#totb").innerHTML=pill(r.total)};
  f.querySelectorAll("[data-r]").forEach(r=>r.oninput=()=>{f.querySelector(`[data-n=${r.dataset.r}]`).value=r.value;upd()});
  f.querySelectorAll("[data-n]").forEach(n=>n.oninput=()=>{f.querySelector(`[data-r=${n.dataset.n}]`).value=n.value;upd()});
  upd();
  f.onsubmit=async e=>{e.preventDefault();const r=read();
    if(r.pen>0&&!f.comment.value.trim()) return toast("Jarima uçun xulosa maydonida asos yozing");
    if(Object.values(r.cr).every(v=>v===0)) return toast("Kamida bitta mezonga ball qöying");
    const notes={};CRITERIA.forEach(k=>{const t=f.querySelector(`[data-t=${k.id}]`).value.trim();if(t)notes[k.id]=t});
    const doc={kind:"s",scheme:SCHEME,counselorId:c.docId,month,criteria:r.cr,subs:r.subs,penalty:r.pen,total:r.total,notes,comment:f.comment.value.trim(),region:c.region,district:c.district,evaluatedBy:S.uid||null,updatedAt:new Date().toISOString()};
    if(c.demo) doc.demo=true;
    $("#saveE").disabled=true;
    try{await db.doc(wpath()+"/"+sid).set(doc);await logH("s-save",{counselorId:c.docId,month,total:r.total,criteria:r.cr,penalty:r.pen,prev:ex?ex.total:null});closeModal();toast("Baho saqlandi: "+fmt(r.total))}catch(err){handleWriteErr(err);$("#saveE").disabled=false}
  };
  const de=$("#delE"); if(de) de.onclick=async()=>{de.disabled=true;try{await db.doc(wpath()+"/"+sid).delete();await logH("s-del",{counselorId:c.docId,month,prev:ex?ex.total:null});closeModal();toast("Baho öçirildi")}catch(err){handleWriteErr(err)}};
}

function handleWriteErr(err){
  const code=err&&err.code;
  if(code==="permission_denied"||code==="not_found"||code==="not-found"){toast("Ruxsat yöq: bu amalni faqat biriktirilgan mutaxassis bajaradi");return}
  if(code==="invalid_argument"){S.canWrite=false;toast("Sizda yoziş huquqi yöq — faqat köriş rejimi");render()}
  else if(code==="quota_exceeded") toast("Ma'lumotlar bazasi töldi: eski yozuvlarni öçiring");
  else toast("Saqlab bölmadi, qayta urinib köring");
}

/* ============ NAMUNA MA'LUMOT (faqat egasi) ============ */
const DEMO_D={"Qoraqalpoğiston Respublikasi":["Nukus şahri","Xöjayli tumani"],"Andijon viloyati":["Asaka tumani","Andijon şahri"],"Buxoro viloyati":["Ğijduvon tumani","Kogon şahri"],"Farğona viloyati":["Marğilon şahri","Quva tumani"],"Jizzax viloyati":["Zomin tumani"],"Xorazm viloyati":["Xiva şahri","Urganç şahri"],"Namangan viloyati":["Çust tumani","Pop tumani"],"Navoiy viloyati":["Karmana tumani"],"Qaşqadaryo viloyati":["Şahrisabz şahri","Qarşi şahri"],"Samarqand viloyati":["Oqdaryo tumani","Urgut tumani","Pastdarğom tumani"],"Sirdaryo viloyati":["Guliston şahri"],"Surxondaryo viloyati":["Termiz şahri","Denov tumani"],"Toşkent viloyati":["Çirçiq şahri","Zangiota tumani"],"Toşkent şahri":["Çilonzor tumani","Yunusobod tumani","Mirzo Uluğbek tumani"]};
const FN=["Aliyev","Karimova","Rahimov","Yusupova","Toşmatov","Ergaşeva","Nazarov","Qodirova","Sobirov","Abdullayeva","Xolmatov","Mirzayeva","Islomov","Saidova","Jörayev","Usmonova"];
const GN=["Jasur","Dilnoza","Sardor","Madina","Bekzod","Nilufar","Otabek","Gulnoza","Şaxzod","Malika","Javohir","Zarina","Uluğbek","Kamola","Doniyor","Sevara"];
function openDemo(){
  const has=S.counselors.some(c=>c.demo);
  openModal(`<div class="mh"><h3>Namuna ma'lumotlar</h3><button class="x" data-close>×</button></div><div class="mb">
  <p>Tizimni körsatiş (taqdimot, himoya) uçun barça hududlarda <b>namuna</b> belgili maslahatçilar va sönggi 2 oy uçun tasodifiy baholar yaratiladi. Haqiqiy ma'lumotlarga ta'sir qilmaydi va bir tugma bilan öçiriladi.</p>
  <div id="demoProg" class="small muted"></div></div>
  <div class="mf"><div>${has?`<button class="btn danger" id="demoDel">Namunalarni öçiriş</button>`:""}</div><div style="display:flex;gap:8px"><button class="btn" data-close>Yopiş</button>${has?"":`<button class="btn navy" id="demoAdd">Yaratiş</button>`}</div></div>`);
  const add=$("#demoAdd"); if(add) add.onclick=async()=>{add.disabled=true;await makeDemo()};
  const del=$("#demoDel"); if(del) del.onclick=async()=>{del.disabled=true;await clearDemo()};
}
async function makeDemo(){
  const prog=$("#demoProg"); let n=0,i=0;
  const months=[PERIOD_MONTHS[1],PERIOD_MONTHS[0]];
  try{
    for(const [reg,ds] of Object.entries(DEMO_D)){
      for(const d of ds){
        const cnt=2+(i%2);
        for(let j=0;j<cnt;j++){i++;
          const skill=0.45+Math.random()*0.5;
          const ref=await db.collection(wpath()).add({kind:"c",name:FN[i%FN.length]+" "+GN[(i*7)%GN.length],region:reg,district:d,school:(5+((i*13)%60))+"-maktab",cert:Math.random()<skill-0.2,demo:true,createdAt:new Date().toISOString()});
          for(const m of months){
            const cr={},subs={};CRITERIA.forEach(k=>{let t=0;k.subs.forEach(sb=>{const v=Math.round(clampNum(sb.max*(skill+(Math.random()-0.5)*0.4),0,sb.max)*2)/2;subs[k.id+"_"+sb.id]=v;t+=v});cr[k.id]=t});
            const tot=Math.round(Object.values(cr).reduce((a,b)=>a+b,0)*10)/10;
            await db.doc(wpath()+"/s_"+ref.id+"__"+m).set({kind:"s",scheme:SCHEME,counselorId:ref.id,month:m,criteria:cr,subs,penalty:0,total:tot,notes:{},comment:"",region:reg,district:d,demo:true,updatedAt:new Date().toISOString()});
          }
          n++; if(prog) prog.textContent=n+" ta namuna yaratildi…";
        }
      }
    }
    closeModal();toast("Namuna ma'lumotlar tayyor");
  }catch(err){handleWriteErr(err)}
}
async function clearDemo(){
  const prog=$("#demoProg");
  try{
    const sc=S.scores.filter(s=>s.demo&&s.owner===S.uid); const cs=S.counselors.filter(c=>c.demo&&c.owner===S.uid); let k=0;
    for(const s of sc){await db.doc(wpath()+"/"+s.docId).delete();if(++k%10===0&&prog)prog.textContent=k+" ta yozuv öçirildi…"}
    for(const c of cs){await db.doc(wpath()+"/"+c.docId).delete();if(++k%10===0&&prog)prog.textContent=k+" ta yozuv öçirildi…"}
    S.counselor=null;closeModal();toast("Namunalar öçirildi");
  }catch(err){handleWriteErr(err)}
}

/* ============ ULANIŞ ============ */
render();
try{S.out=localStorage.getItem("kpi_out")==="1";localStorage.removeItem("kpi_role");const v=JSON.parse(localStorage.getItem("kpi_view")||"null");if(v&&v.level)S.view={level:v.level,region:v.region?yA(v.region):null,district:v.district?yA(v.district):null}}catch(_){}
(async()=>{
  const conn=$("#conn");
  db=await window.claude?.use?.("db"); user=await window.claude?.use?.("user");
  if(!db){S.roleReady=true;conn.textContent="Ma'lumotlar bazasi mavjud emas";S.loaded=true;S.canWrite=false;
    document.body.classList.remove("auth");
    $("#app").innerHTML='<div class="card empty" style="margin-top:20px"><b>Ma\'lumotlar bazasiga ulanib bölmadi</b>Sahifani claude.ai orqali tizimga kirgan holda oçing.</div>';return}
  if(user){
    try{S.isOwner=!!(await user.isOwner())}catch(_){}
    try{const cw=await user.can("data.write");S.canWrite=cw===null||cw===undefined?null:!!cw}catch(_){}
    try{S.uid=await user.id()}catch(_){}
    try{S.canEdit=!!(await user.canEdit())}catch(_){}
    try{const me=await user.me();S.meName=yA((me&&me.name)||"")}catch(_){}
  }
  const subs={}, pending=new Set(); let aclLoaded=false;
  const timer=setTimeout(()=>{if(!S.loaded){conn.textContent="Ulaniş sekin…";S.loaded=true;S.roleReady=true;render()}},10000);
  const check=()=>{if(aclLoaded&&!pending.size&&!S.loaded){S.loaded=true;clearTimeout(timer);conn.textContent=S.canWrite===false?"Köriş rejimi":"Onlayn"}render()};
  const syncWs=()=>{
    const want=new Set(Object.entries(S.acl).filter(([u,a])=>a&&a.active!==false&&(a.admin||a.level==="tum")).map(([u])=>u));
    for(const u of Object.keys(subs)) if(!want.has(u)){try{subs[u]()}catch(_){};delete subs[u];delete S.ws[u];pending.delete(u)}
    for(const u of want) if(!subs[u]){pending.add(u);
      subs[u]=db.collection("w/"+u+"/d").onSnapshot(sn=>{S.ws[u]=sn.docs.map(d=>({id:d.id,...d.data()}));pending.delete(u);rebuild();check()},
        ()=>{pending.delete(u);check()});}
    rebuild();
  };
  db.collection("acl").onSnapshot(sn=>{
    S.acl={};sn.docs.forEach(d=>{S.acl[d.id]=d.data()});
    if(isAdmin()&&S.uid&&!S.acl[S.uid]) db.doc("acl/"+S.uid).set({level:"resp",region:null,district:null,admin:true,at:new Date().toISOString(),by:S.uid}).catch(()=>{});
    const had=!!S.role; deriveRole();
    if(S.role&&!had){S.tab=S.role.level==="tum"?"eval":"monitor";S.region=S.role.region;S.district=S.role.district;if(S.myReq)S.myReq=null}
    if(!S.role&&had){S.tab="monitor";S.region=null;S.district=null;S.counselor=null}
    S.roleReady=true;aclLoaded=true;loadNames(Object.keys(S.acl));syncWs();check();
  },()=>{aclLoaded=true;S.roleReady=true;conn.textContent="Ulanişda xato";check()});
  if(isAdmin()) db.collection("req").onSnapshot(sn=>{S.reqs=sn.docs.map(d=>({uid:d.id,...d.data()}));loadNames(S.reqs.map(q=>q.uid));render()},()=>{});
  else if(S.uid){
    const g=async()=>{if(S.role){S.myReq=null;return}try{const p=await db.doc("req/"+S.uid).get();S.myReq=p.exists?p.data():null}catch(_){S.myReq=null}render()};
    g(); setInterval(g,30000);
  } else S.myReq=null;
})();
</script>
